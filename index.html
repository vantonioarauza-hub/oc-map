<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC World Registry</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Icons (Lucide) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 1. Base Variables & Reset - Strict, flat palette */
    :root {
      --bg-dark: #0a0a0a;
      --bg-panel: #141414;
      --bg-hover: #1f1f1f;
      --border: #262626;
      --text-main: #ededed;
      --text-muted: #a3a3a3;
      --brand: #5865F2; /* Flat Discord Blurple, used sparingly */
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body { 
      display: flex; 
      height: 100vh; 
      background: var(--bg-dark); 
      color: var(--text-main); 
      overflow: hidden;
    }

    /* 2. Layout Structure - No centering in the void */
    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #sidebar {
      width: 340px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10; /* Above map */
    }

    #map { 
      flex: 1;
      background: var(--bg-dark);
    }

    /* 3. Sidebar Header & Search */
    .sidebar-header {
      padding: 24px 24px 16px 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 10px 12px 10px 36px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--text-muted);
    }

    /* 4. List View & Empty States (Human microcopy) */
    #roster-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .status-message {
      padding: 24px 12px;
      font-size: 14px;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.5;
    }

    .roster-card {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.1s;
    }

    .roster-card:hover {
      background: var(--bg-hover);
    }

    .roster-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }

    .roster-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .roster-meta i {
      width: 12px;
      height: 12px;
    }

    /* 5. The Hand-Made Detail: Polaroid Map Pins */
    .polaroid-pin {
      background: #fafafa;
      padding: 4px 4px 14px 4px; /* Bottom-heavy padding */
      box-shadow: 2px 4px 12px rgba(0,0,0,0.4);
      border-radius: 2px;
      width: 44px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      transform-origin: center center;
    }

    .polaroid-pin:hover {
      box-shadow: 4px 8px 16px rgba(0,0,0,0.6);
    }

    .polaroid-img {
      width: 36px;
      height: 36px;
      background: #e5e5e5;
      object-fit: cover;
      display: block;
      border-radius: 1px;
    }

    /* 6. Clean, Flat Popup Override */
    .leaflet-popup-content-wrapper { 
      background: var(--bg-panel) !important;
      color: var(--text-main) !important; 
      border-radius: 4px !important; 
      border: 1px solid var(--border) !important; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
      padding: 0 !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      width: 260px !important;
    }

    .leaflet-popup-tip { 
      background: var(--bg-panel) !important; 
      border-bottom: 1px solid var(--border) !important;
      border-right: 1px solid var(--border) !important;
    }

    .popup-header {
      padding: 16px 16px 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .popup-header h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .popup-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .popup-meta i {
      width: 14px;
      height: 14px;
    }

    .popup-body {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn { 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px; 
      border-radius: 4px; 
      text-decoration: none; 
      font-size: 13px; 
      font-weight: 500; 
      border: 1px solid var(--border);
      color: var(--text-main);
      background: var(--bg-dark);
      transition: background 0.1s, border-color 0.1s;
    }

    .btn i { width: 14px; height: 14px; }
    .btn:hover { background: var(--bg-hover); border-color: #404040; }

    /* Accent color only used for primary action */
    .btn-primary { 
      background: var(--brand); 
      border-color: var(--brand);
    }
    .btn-primary:hover { 
      background: #4752c4; 
      border-color: #4752c4;
    }

    /* Flat cluster styling */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: transparent !important;
    }
    .marker-cluster div {
      background-color: var(--bg-panel) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-main) !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 13px !important;
      font-weight: 500 !important;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <i data-lucide="globe"></i>
          Registry Records
        </div>
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="text" id="searchInput" placeholder="Find by name, location, or creator..." autocomplete="off">
        </div>
      </div>
      <div id="roster-list">
        <!-- Zero state design -->
        <div class="status-message" id="status-text">
          Pulling up the map records...
        </div>
      </div>
    </aside>

    <main id="map"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // Initialize icons
    lucide.createIcons();

    const API_URL = 'https://script.google.com/macros/s/AKfycbzWvHeUVafTSusTld5wreBbY9lR_eQWoG_467p7E94fA5bl1T4fd8ne4EpYKhdt_OLR2A/exec';

    // Global state for the search filter
    let ocData = [];

    // Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([20, 0], 3);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Free, clean map tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markers = L.markerClusterGroup({
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      maxClusterRadius: 40
    });

    const rosterList = document.getElementById('roster-list');
    const searchInput = document.getElementById('searchInput');

    // Fetch the data
    fetch(API_URL, { redirect: 'follow' })
      .then(res => res.json())
      .then(data => {
        ocData = data;
        renderApp(ocData);
      })
      .catch(err => {
        rosterList.innerHTML = `<div class="status-message">Couldn't connect to the database. Check your connection and try again.</div>`;
      });

    // Handle Search
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = ocData.filter(oc => 
        (oc.ocName && oc.ocName.toLowerCase().includes(term)) ||
        (oc.city && oc.city.toLowerCase().includes(term)) ||
        (oc.discordUsername && oc.discordUsername.toLowerCase().includes(term)) ||
        (oc.country && oc.country.toLowerCase().includes(term))
      );
      renderApp(filtered, term !== '');
    });

    function renderApp(data, isSearch = false) {
      // Clear current map pins and sidebar
      markers.clearLayers();
      rosterList.innerHTML = '';

      // Empty State Design
      if (data.length === 0) {
        rosterList.innerHTML = `
          <div class="status-message">
            Nobody matched that search. Try a different name or city.
          </div>
        `;
        return;
      }

      data.forEach(oc => {
        const locationText = oc.hospital ? `${oc.hospital}, ${oc.city}` : oc.city;
        
        // Build Sidebar Item
        const btn = document.createElement('button');
        btn.className = 'roster-card';
        btn.innerHTML = `
          <div class="roster-name">${escapeHtml(oc.ocName)}</div>
          <div class="roster-meta">
            <i data-lucide="map-pin"></i> ${escapeHtml(locationText)}
          </div>
        `;
        btn.onclick = () => {
          map.setView([oc.lat, oc.lon], 6);
          // Slight delay to allow spiderfy to resolve before opening popup
          setTimeout(() => marker.openPopup(), 300);
        };
        rosterList.appendChild(btn);

        // Build Polaroid Map Pin
        // The hand-made touch: deterministic slight rotation based on coordinates
        const pseudoRandomRotation = Math.floor((Math.abs(oc.lat) + Math.abs(oc.lon)) % 12) - 6; 
        const avatarElementId = `avatar-${Math.random().toString(36).substr(2, 9)}`;
        const defaultAvatar = 'https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png';

        const customIcon = L.divIcon({
          className: 'leaflet-polaroid', // custom class to avoid default leaf styling
          html: `
            <div class="polaroid-pin" style="transform: rotate(${pseudoRandomRotation}deg);" onmouseover="this.style.transform='rotate(0deg) scale(1.05)'" onmouseout="this.style.transform='rotate(${pseudoRandomRotation}deg) scale(1)'">
              <img class="polaroid-img" id="${avatarElementId}" src="${defaultAvatar}" alt="Profile">
            </div>
          `,
          iconSize: [44, 54],
          iconAnchor: [22, 54],
          popupAnchor: [0, -50]
        });

        // Build Flat Popup
        const userLink = oc.discordId ? `https://discord.com/users/${oc.discordId}` : null;
        const popupContent = `
          <div class="popup-header">
            <h3>${escapeHtml(oc.ocName)}</h3>
            <div class="popup-meta">
              <i data-lucide="user"></i> @${escapeHtml(oc.discordUsername)}
            </div>
            <div class="popup-meta" style="margin-top: 4px;">
              <i data-lucide="map-pin"></i> ${escapeHtml(locationText)}, ${escapeHtml(oc.country)}
            </div>
          </div>
          <div class="popup-body">
            ${userLink ? `<a class="btn" href="${userLink}" target="_blank"><i data-lucide="message-square"></i> Open Discord profile</a>` : ''}
            ${oc.profileLink ? `<a class="btn btn-primary" href="${oc.profileLink}" target="_blank"><i data-lucide="file-text"></i> Read character sheet</a>` : ''}
          </div>
        `;

        const marker = L.marker([oc.lat, oc.lon], { icon: customIcon });
        marker.bindPopup(popupContent);
        markers.addLayer(marker);

        // Fixed Discord Avatar Fetcher using reliable mesalinc lookup
        if (oc.discordId && /^\d+$/.test(oc.discordId)) {
          fetch(`https://discordlookup.mesalinc.com/v1/user/${oc.discordId}`)
            .then(r => r.json())
            .then(userData => {
              // The API returns the direct image URL in avatar.link
              if (userData && userData.avatar && userData.avatar.link) {
                const img = document.getElementById(avatarElementId);
                if (img) {
                  img.src = userData.avatar.link + '?size=64';
                }
              }
            })
            .catch(() => { /* Fails silently, leaves default gray polaroid */ });
        }
      });

      map.addLayer(markers);
      lucide.createIcons(); // Re-initialize icons for dynamically created DOM elements
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
